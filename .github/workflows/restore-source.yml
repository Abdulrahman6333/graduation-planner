name: Restore portfolio source

on:
  push:
    paths:
      - "payload/READY"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild app.py
        shell: bash
        run: |
          cat payload/part_* > app.py.gz.b64
          base64 -d app.py.gz.b64 > app.py.gz
          gzip -dc app.py.gz > app.py
          rm -rf payload app.py.gz app.py.gz.b64
      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add application source" || exit 0
          git push
